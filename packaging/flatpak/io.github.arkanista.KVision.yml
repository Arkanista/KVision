app-id: io.github.arkanista.KVision
runtime: org.kde.Platform
runtime-version: '5.15-24.08'
sdk: org.kde.Sdk
command: kvision

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-videos
  - --filesystem=xdg-pictures

modules:
  - name: googletest
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_GMOCK=OFF
    sources:
      - type: archive
        url: https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz
        sha256: 8ad598c73ad796e0d8280b082cebd82a630d73e73cd3c70057938a6501bba5d7

  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - >-
        ./configure
        --prefix=/app
        --enable-shared
        --disable-static
        --disable-debug
        --disable-doc
        --disable-ffplay
        --disable-ffprobe
        --disable-avdevice
        --enable-gpl
        --enable-gnutls
        --enable-vaapi
        --enable-libdrm
        --enable-zlib
      - make -j$(nproc)
      - make install
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg/examples
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz
        sha256: 1a4d394ae63d190a526cd052eb4415c156b5c5e2df37efab41a7de0b8fde2433

  - name: kvision
    buildsystem: simple
    build-commands:
      - cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_TESTING=OFF
      - cmake --build build -j$(nproc)
      - DESTDIR=stage cmake --install build
      - mkdir -p /app/bin /app/lib
      - cp -a stage/app/bin/. /app/bin/
      - cp -a stage/app/lib/. /app/lib/
      - install -Dm644 stage/app/share/applications/kvision.desktop /app/share/applications/io.github.arkanista.KVision.desktop
      - sed -i 's/^Icon=.*/Icon=io.github.arkanista.KVision/' /app/share/applications/io.github.arkanista.KVision.desktop
      - install -Dm644 stage/app/share/icons/hicolor/128x128/apps/kvision.png /app/share/icons/hicolor/128x128/apps/io.github.arkanista.KVision.png
      - install -Dm644 stage/app/share/icons/hicolor/256x256/apps/kvision.png /app/share/icons/hicolor/256x256/apps/io.github.arkanista.KVision.png
      - install -Dm644 stage/app/share/icons/hicolor/512x512/apps/kvision.png /app/share/icons/hicolor/512x512/apps/io.github.arkanista.KVision.png
    sources:
      - type: dir
        path: ../..
