app-id: io.github.arkanista.KVision
runtime: org.kde.Platform
runtime-version: '5.15-24.08'
sdk: org.kde.Sdk
command: kvision

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-videos
  - --filesystem=xdg-pictures

modules:
  - name: googletest
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_GMOCK=OFF
    sources:
      - type: archive
        url: https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz
        sha256: 8ad598c73ad796e0d8280b082cebd82a630d73e73cd3c70057938a6501bba5d7

  - name: kvision
    buildsystem: simple
    build-commands:
      - cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_INSTALL_BINDIR=/app/bin -DCMAKE_INSTALL_LIBDIR=/app/lib -DBUILD_TESTING=OFF
      - cmake --build build -j$(nproc)
      - DESTDIR=stage cmake --install build
      - cp -a stage/app/. /app/
      - install -Dm644 stage/usr/share/applications/kvision.desktop /app/share/applications/io.github.arkanista.KVision.desktop
      - sed -i 's/^Icon=.*/Icon=io.github.arkanista.KVision/' /app/share/applications/io.github.arkanista.KVision.desktop
      - install -Dm644 stage/usr/share/icons/hicolor/128x128/apps/kvision.png /app/share/icons/hicolor/128x128/apps/io.github.arkanista.KVision.png
      - install -Dm644 stage/usr/share/icons/hicolor/256x256/apps/kvision.png /app/share/icons/hicolor/256x256/apps/io.github.arkanista.KVision.png
      - install -Dm644 stage/usr/share/icons/hicolor/512x512/apps/kvision.png /app/share/icons/hicolor/512x512/apps/io.github.arkanista.KVision.png
    sources:
      - type: dir
        path: ../..
