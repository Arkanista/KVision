name: Release Tag Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    uses: ./.github/workflows/build-deb.yml
    with:
      publish: false
  appimage:
    uses: ./.github/workflows/build-appimage.yml
    with:
      publish: false
  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      publish: false
  arch:
    uses: ./.github/workflows/build-arch.yml
    with:
      publish: false

  publish-release:
    name: Publish all packages to tag release
    needs: [deb, appimage, windows, arch]
    if: startsWith(github.ref, 'refs/tags/v') && needs.deb.result == 'success' && needs.appimage.result == 'success' && needs.windows.result == 'success' && needs.arch.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.zip
            release-assets/*.pkg.tar.zst
