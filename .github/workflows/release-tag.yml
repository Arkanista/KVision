name: Release Tag Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    uses: ./.github/workflows/build-deb.yml
    with:
      publish: false
  appimage:
    uses: ./.github/workflows/build-appimage.yml
    with:
      publish: false
  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      publish: false
  arch:
    uses: ./.github/workflows/build-arch.yml
    with:
      publish: false
  rpm:
    uses: ./.github/workflows/build-rpm.yml
    with:
      publish: false
  flatpak:
    uses: ./.github/workflows/build-flatpak.yml
    with:
      publish: false

  publish-release:
    name: Publish all packages to tag release
    needs: [deb, appimage, windows, arch, rpm, flatpak]
    if: startsWith(github.ref, 'refs/tags/v') && needs.deb.result == 'success' && needs.appimage.result == 'success' && needs.windows.result == 'success' && needs.arch.result == 'success' && needs.rpm.result == 'success' && needs.flatpak.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate version.json
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          tag = os.environ["TAG_NAME"]
          payload = {
              "version": tag[1:] if tag.startswith("v") else tag,
              "tag": tag,
              "publishedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "releaseUrl": f"https://github.com/Arkanista/KVision/releases/tag/{tag}",
          }
          with open("release-assets/version.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY

      - name: Create or update GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.AppImage.zsync
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.pkg.tar.zst
            release-assets/*.rpm
            release-assets/*.flatpak
            release-assets/version.json
