name: DEB Packages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: "Publish release assets from this workflow"
        type: boolean
        required: false
        default: true
  push:
    branches: [master]
    paths:
      - "src/**"
      - "images/**"
      - "translations/**"
      - "CMakeLists.txt"
      - "kvision.qrc"
      - "kvision.desktop"
      - "debian/**"
      - "tools/build_deb.sh"
      - ".github/workflows/build-deb.yml"
  pull_request:
    paths:
      - "src/**"
      - "images/**"
      - "translations/**"
      - "CMakeLists.txt"
      - "kvision.qrc"
      - "kvision.desktop"
      - "debian/**"
      - "tools/build_deb.sh"
      - ".github/workflows/build-deb.yml"

jobs:
  build-deb:
    name: DEB (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm
            label: debian12
          - image: debian:trixie
            label: debian13
          - image: ubuntu:22.04
            label: ubuntu22.04
          - image: ubuntu:24.04
            label: ubuntu24.04
          - image: ubuntu:26.04
            label: ubuntu26.04
          - image: ubuntu:26.10
            label: ubuntu26.10
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build .deb inside ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "${{ matrix.image }}" \
            ./tools/build_deb.sh "${{ matrix.label }}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvision-deb-${{ matrix.label }}
          path: dist/*.deb

  publish-deb:
    name: Publish DEB packages
    needs: [build-deb]
    if: (github.event_name != 'workflow_call' || inputs.publish) && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: kvision-deb-*
          merge-multiple: true

      - name: Prune stale .deb assets from linux-latest
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view linux-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            for asset in $(gh release view linux-latest --repo "${{ github.repository }}" --json assets --jq '.assets[].name | select(endswith(".deb"))'); do
              echo "Deleting stale .deb asset: $asset"
              gh release delete-asset linux-latest "$asset" --repo "${{ github.repository }}" --yes || true
            done
          fi

      - name: Publish to rolling linux-latest pre-release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-latest
          name: Linux Packages (DEB, AppImage, Arch x64)
          prerelease: true
          fail_on_unmatched_files: true
          files: release-assets/*.deb

      - name: Attach .deb packages to version release tag
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: release-assets/*.deb
