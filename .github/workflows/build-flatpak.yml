name: Flatpak Package

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: "Publish release assets from this workflow"
        type: boolean
        required: false
        default: true
  push:
    branches: [master]
    paths:
      - "src/**"
      - "images/**"
      - "translations/**"
      - "CMakeLists.txt"
      - "kvision.qrc"
      - "kvision.desktop"
      - "packaging/flatpak/**"
      - "tools/build_flatpak.sh"
      - ".github/workflows/build-flatpak.yml"
  pull_request:
    paths:
      - "src/**"
      - "images/**"
      - "translations/**"
      - "CMakeLists.txt"
      - "kvision.qrc"
      - "kvision.desktop"
      - "packaging/flatpak/**"
      - "tools/build_flatpak.sh"
      - ".github/workflows/build-flatpak.yml"

jobs:
  build-flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flatpak & KDE 5.15-24.08 SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Platform//5.15-24.08 org.kde.Sdk//5.15-24.08

      - name: Build Flatpak bundle
        run: ./tools/build_flatpak.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvision-flatpak-x86_64
          path: dist/*.flatpak

  publish-flatpak:
    name: Publish Flatpak package
    needs: [build-flatpak]
    if: (github.event_name != 'workflow_call' || inputs.publish) && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Flatpak artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: kvision-flatpak-x86_64

      - name: Prune stale .flatpak assets from linux-latest
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view linux-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            for asset in $(gh release view linux-latest --repo "${{ github.repository }}" --json assets --jq '.assets[].name | select(endswith(".flatpak"))'); do
              echo "Deleting stale .flatpak asset: $asset"
              gh release delete-asset linux-latest "$asset" --repo "${{ github.repository }}" --yes || true
            done
          fi

      - name: Publish to rolling linux-latest pre-release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-latest
          name: Linux Packages (DEB, RPM, Flatpak, AppImage, Arch x64)
          prerelease: true
          fail_on_unmatched_files: true
          files: release-assets/*.flatpak

      - name: Attach .flatpak package to version release tag
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: release-assets/*.flatpak
