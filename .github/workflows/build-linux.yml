name: Linux DEB & AppImage builds

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/**"
      - "images/**"
      - "translations/**"
      - "CMakeLists.txt"
      - "kvision.qrc"
      - "kvision.desktop"
      - "debian/**"
      - "tools/build_deb.sh"
      - "tools/build_appimage.sh"
      - ".github/workflows/build-linux.yml"

jobs:
  build-deb:
    name: DEB (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm
            label: debian12
          - image: debian:trixie
            label: debian13
          - image: ubuntu:22.04
            label: ubuntu22.04
          - image: ubuntu:24.04
            label: ubuntu24.04
          - image: ubuntu:26.04
            label: ubuntu26.04
          - image: ubuntu:26.10
            label: ubuntu26.10
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build .deb inside ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            "${{ matrix.image }}" \
            ./tools/build_deb.sh "${{ matrix.label }}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvision-deb-${{ matrix.label }}
          path: dist/*.deb

  build-appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build portable AppImage inside ubuntu:22.04
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ubuntu:22.04 \
            ./tools/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvision-appimage-x86_64
          path: dist/*.AppImage

  publish-release:
    name: Publish Linux packages
    needs: [build-deb, build-appimage]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Publish to rolling linux-latest pre-release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-latest
          name: Linux DEB & AppImage (x64)
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Automated Linux x86_64 builds of KVision:
            - Native `.deb` packages for **Debian 12 (`bookworm`)**, **Debian 13 (`trixie`)**, and **Ubuntu `22.04` / `24.04` / `26.04` / `26.10`** (`sudo apt install ./kvision_*.deb`).
            - Portable **AppImage** (`KVision-*-x86_64.AppImage`) built against Ubuntu 22.04 baseline (`chmod +x` and run directly on any modern Linux distribution).
          files: |
            release-assets/*.deb
            release-assets/*.AppImage

      - name: Attach Linux packages to version release tag
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.deb
            release-assets/*.AppImage
